name: CD – Deploy to Render

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Step 1 – Checkout Code
        uses: actions/checkout@v4

      - name: Step 3 – Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Step 4 – Deployment Confirmation
        run: |
          echo "✅ Deployment triggered at $(date)"
          echo "TaskFlow has been deployed to Render successfully."
