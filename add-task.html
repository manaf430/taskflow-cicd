<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaskFlow – Add Task</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="add-task.html">Add Task</a>
      <a href="task-list.html">Task List</a>
      <a href="task-detail.html">Task Detail</a>
      <a href="about.html">About</a>
    </nav>
  </header>
  <div class="container">
    <h2>Add New Task</h2>
    <form>
      <label>Task Title:<br/><input type="text" placeholder="Enter title" style="width:100%;padding:8px;margin:8px 0;"/></label><br/>
      <label>Description:<br/><textarea rows="4" placeholder="Enter description" style="width:100%;padding:8px;margin:8px 0;"></textarea></label><br/>
      <label>Due Date:<br/><input type="date" style="padding:8px;margin:8px 0;"/></label><br/>
      <label>Priority:
        <select style="padding:8px;margin:8px 0;">
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
      </label><br/><br/>
      <button type="submit" class="btn">Add Task</button>
    </form>
  </div>
  <footer>TaskFlow &copy; 2026</footer>
</body>
</html>
